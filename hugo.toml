# El baseURL real lo pone el workflow en el build (hugo -b <url de GitHub Pages>). Ver .github/workflows/publicar.yml.
# Los enlaces internos deben usar relURL SIN barra inicial ("notas/" | relURL) o .RelPermalink: el sitio vive en un subdirectorio.
baseURL = "/"
languageCode = "es-MX"
defaultContentLanguage = "es"
title = "Colores Ruidosos"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

[params]
  descripcion = "Fanzine digital de la escena indie y rock, hecho por un grupo de amigos en México."
  curadores = ["Pardy", "Tanelly", "Dany", "Pratz"]
  firma_sin_curador = "Cartelera"
  # URL de la aplicación web de Apps Script del ranking de la trivia (docs/ranking/README.md).
  # Vacía = el ranking no aparece en el sitio.
  trivia_ranking_url = "https://script.google.com/macros/s/AKfycbyXT2UuJZfnpcZWH61l0YeI4kfDYNKrQrH-E8-mL4OMuytXB-pqlHohSDkrGrwLGgPl/exec"

  # Insignia de concierto «Noches reversibles» (F26/D32). El código va en el QR del cartel
  # (docs/concierto/); usa solo letras sin acento y números. Si lo cambias, regenera el cartel.
  # Sin esta tabla, el formulario del código no aparece.
  [params.trivia_concierto]
    codigo = "LOLMEXICO26"
    desde = "2026-11-24T00:00:00-06:00"
    hasta = "2026-11-28T23:59:59-06:00"

[permalinks.page]
  posts = "/notas/:slug/"
[permalinks.section]
  posts = "/notas/"

[markup.goldmark.renderer]
  unsafe = false   # el HTML crudo dentro de las notas no se renderiza

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
