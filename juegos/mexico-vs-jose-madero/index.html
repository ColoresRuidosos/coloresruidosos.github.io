<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>México vs. José Madero</title>
<meta name="description" content="Homenaje no oficial a José Madero hecho por fans de Colores Ruidosos: el Museo, Carmesí y Noche.">
<style>
  :root { --bg: #f3eefb; --fg: #1b1226; --muted: #5b4880; --btn: #e6ddf3; --btn-on: #d8312b; --accent: #d8312b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #120b1c; --fg: #efe8d4; --muted: #b9a8d6; --btn: #2a1d3d; --btn-on: #d8312b; } }
  :root[data-theme="dark"] { --bg: #120b1c; --fg: #efe8d4; --muted: #b9a8d6; --btn: #2a1d3d; --btn-on: #d8312b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 500 13px system-ui, sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 8px 16px; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; max-width: 100%; box-shadow: 0 8px 32px #0006; }
  .bar { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 12px; max-width: 100%; flex-wrap: wrap; justify-content: center; }
  .bar button { background: var(--btn); color: var(--fg); border: 0; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  .pad { display: none; width: min(100%, 520px); justify-content: space-between; align-items: center; margin-top: 14px; }
  @media (pointer: coarse) { .pad { display: flex; } .keys { display: none; } }
  .pad .dir, .pad .act { display: flex; gap: clamp(6px, 2.5vw, 12px); align-items: center; }
  .pad, .pad * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  /* v9.4: los botones se encogen en celulares estrechos (el navegador de Instagram dejaba la A fuera) */
  .pad button { width: clamp(50px, 17vw, 72px); height: clamp(50px, 17vw, 72px); border-radius: 50%; border: 3px solid var(--fg); background: var(--btn); color: var(--fg); font: 800 clamp(18px, 5vw, 22px) system-ui, sans-serif; touch-action: none; flex: none; }
  .pad button.on { background: var(--btn-on); color: #fff; }
  .listen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: #0009; z-index: 10; }
  .listen[hidden] { display: none; }
  .listen__box { width: min(100%, 360px); background: var(--bg); color: var(--fg); border: 3px solid var(--fg); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .listen__title { margin: 0; font: 800 18px system-ui, sans-serif; }
  .listen__note { margin: 0; color: var(--muted); }
  .listen__links { display: flex; flex-direction: column; gap: 8px; }
  .listen__links a, .listen__close { display: block; text-align: center; padding: 12px; border-radius: 8px; font: 700 15px system-ui, sans-serif; text-decoration: none; background: var(--btn); color: var(--fg); border: 0; cursor: pointer; }
  .listen__links a { background: var(--accent); color: #fff; }
  .pad .act button:last-child { transform: translateY(-18px); }
  .pad .act button.star { width: clamp(44px, 13vw, 54px); height: clamp(44px, 13vw, 54px); font-size: clamp(16px, 4.5vw, 20px); transform: translateY(26px); }
</style>
</head>
<body>
<canvas id="game" aria-label="Juego México vs. José Madero (prototipo)"></canvas>
<div class="pad" aria-label="Controles táctiles">
  <div class="dir"><button data-btn="left" aria-label="Izquierda">◀</button><button data-btn="right" aria-label="Derecha">▶</button></div>
  <div class="act"><button class="star" data-btn="special" aria-label="Solo de guitarra">★</button><button data-btn="mic" aria-label="Micrófono">B</button><button data-btn="jump" aria-label="Saltar">A</button></div>
</div>
<div class="bar">
  <span class="keys">← → mover · Z saltar · X micrófono (y entrar) · C solo de guitarra · P pausa · M música · N notas · S saltar nota</span>
  <button id="pause" type="button" aria-label="Pausa y opciones">❚❚ PAUSA</button>
  <button id="music" type="button">♪ ON</button>
  <button id="notes" type="button" aria-label="Notas en pantalla (tecla N)">💬 NOTAS: SÍ</button>
  <button id="skip" type="button" hidden aria-label="Saltar la nota (tecla S)">⏭ SALTAR NOTA</button>
  <button id="listen" type="button" hidden>🎧 ESCUCHAR</button>
  <span>Homenaje no oficial · Colores Ruidosos</span><!-- v9.5: sin enlace; un toque sin querer sacaba del juego -->
</div>
<script type="module" src="src/main.js"></script>
<!-- v9.7: escuchar el disco en las plataformas oficiales (otra pestaña; el juego no reproduce su música) -->
<div id="listen-panel" class="listen" hidden role="dialog" aria-modal="true" aria-labelledby="listen-title">
  <div class="listen__box">
    <p id="listen-title" class="listen__title">🎧 Escuchar</p>
    <p class="listen__note">Se abre en otra pestaña; tu partida sigue aquí, en pausa.</p>
    <div class="listen__links"></div>
    <button type="button" class="listen__close">◀ Volver al juego</button>
  </div>
</div>
</body>
</html>
