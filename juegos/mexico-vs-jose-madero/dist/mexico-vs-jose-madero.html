<html lang="es">

<meta charset="utf-8">

<meta name="description" content="Mundo 1 «Carmesí» de un homenaje no oficial a José Madero, por Colores Ruidosos.">
<style>

  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 8px 16px; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

  .bar button { background: var(--btn); color: var(--fg); border: 0; border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  .pad { display: none; width: min(100%, 520px); justify-content: space-between; align-items: center; }

  .pad, .pad * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  .pad button { width: 72px; height: 72px; border-radius: 50%; border: 3px solid var(--fg); background: var(--btn); color: var(--fg); font: 800 22px system-ui, sans-serif; touch-action: none; }
  .pad button.on { background: var(--btn-on); color: #fff; }
  .pad .act button:last-child { transform: translateY(-18px); }
  .pad .act button.star { width: 54px; height: 54px; font-size: 20px; transform: translateY(26px); }
</style>
