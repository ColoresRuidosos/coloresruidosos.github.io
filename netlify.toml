[build]
  command = "hugo --gc --minify -b $URL"
  publish = "public"
  # No reconstruir si el commit solo toca el pipeline de Python, docs o config
  # de GitHub Actions — nada de eso cambia lo que Hugo genera.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- content/ layouts/ assets/ static/ data/ hugo.toml netlify.toml"

[build.environment]
  HUGO_VERSION = "0.166.0"
  TZ = "America/Mexico_City"

[context.deploy-preview]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
