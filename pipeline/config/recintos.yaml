# Recintos cuya cartelera se lee automáticamente.
# El método es JSON-LD (datos schema.org que muchas páginas publican para Google).
# Antes de activar un recinto: probar que su página trae eventos con
#   python pipeline/probar_recinto.py URL
# Recintos que solo publican en Instagram (o cargan su cartelera por JavaScript,
# sin JSON-LD) → cargar sus eventos en la pestaña Eventos del Google Sheet.
#
# 2026-09-17: probados Bajo Circuito, Foro Indie Rocks, Palacio de los
# Deportes y Auditorio Nacional — ninguno trae JSON-LD (dos usan APIs propias
# de JavaScript). Sus eventos van por el Sheet mientras no cambien de sitio.
# Ticketmaster México sí trae JSON-LD pero bloquea al runner de GitHub
# Actions (403); se retira de aquí hasta encontrar una forma honesta de leerlo.
recintos: []
