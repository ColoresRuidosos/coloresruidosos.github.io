# Recintos cuya cartelera se lee automáticamente.
# El método es JSON-LD (datos schema.org que muchas páginas publican para Google).
# Antes de activar un recinto: probar que su página trae eventos con
#   python pipeline/probar_recinto.py URL
# Recintos que solo publican en Instagram: cargar sus eventos en el Google Sheet.
recintos:
  - nombre: Ticketmaster México
    ciudad: ""
    url: https://www.ticketmaster.com.mx/section/conciertos
    activo: true
    # Por ahora solo CDMX (estado "CDMX" en el JSON-LD). Agregar "HID" cuando
    # se quiera incluir Pachuca (Hidalgo).
    regiones: ["CDMX"]
